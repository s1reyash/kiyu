name: 🧒 Kiyu's Daily Planner

on:
  schedule:
    # 7:00 AM IST = 1:30 AM UTC (Morning Routine)
    - cron: '30 1 * * *'
    # 12:32 PM IST = 7:02 AM UTC (Afternoon Play - off-peak minute avoids queue delays)
    - cron: '2 7 * * *'
    # 5:00 PM IST = 11:30 AM UTC (Evening Wind-Down)
    - cron: '30 11 * * *'
    # 8:35 PM IST = 3:05 PM UTC (Daily Progress Report Card & Visual Chart)
    - cron: '5 15 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Time slot or report to send (morning / afternoon / evening / summary)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run mode (true/false) — prints message without sending'
        required: false
        default: 'false'

jobs:
  send-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq

      - name: Determine time slot or action
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          else
            # Determine slot from current UTC time
            HOUR=$(date -u +%-H)
            MINUTE=$(date -u +%-M)
            UTC_MINUTES=$((HOUR * 60 + MINUTE))

            # 1:30 UTC (90 min)  → morning (7:00 AM IST)
            # 7:02 UTC (422 min) → afternoon (12:32 PM IST)
            # 11:30 UTC (690 min)→ evening (5:00 PM IST)
            # 15:05 UTC (905 min)→ summary (8:35 PM IST)
            if [ $UTC_MINUTES -lt 250 ]; then
              echo "slot=morning" >> $GITHUB_OUTPUT
            elif [ $UTC_MINUTES -lt 550 ]; then
              echo "slot=afternoon" >> $GITHUB_OUTPUT
            elif [ $UTC_MINUTES -lt 800 ]; then
              echo "slot=evening" >> $GITHUB_OUTPUT
            else
              echo "slot=summary" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Send daily plan or report card
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIME_SLOT: ${{ steps.slot.outputs.slot }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          chmod +x scripts/*.sh
          echo "🔄 Syncing Telegram family commands..."
          bash scripts/bot_sync.sh || true
          
          if [ "${{ steps.slot.outputs.slot }}" = "summary" ]; then
            echo "📊 Running daily progress report card..."
            bash scripts/send_daily_summary.sh
          else
            echo "📋 Sending activity plan for ${{ steps.slot.outputs.slot }}..."
            bash scripts/send_plan.sh
          fi

      - name: Commit updated history and tracker data
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        run: |
          git config user.name "Kiyu Planner Bot"
          git config user.email "bot@kiyu-planner.local"
          git add data/history.json data/tracker.json docs/data/tracker.json data/.telegram_offset || true
          if ! git diff --cached --quiet; then
            git commit -m "📋 Update activity history and progress tracker [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
