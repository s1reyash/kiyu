name: 🧒 Kiyu's Daily Planner

on:
  schedule:
    # 7:00 AM IST = 1:30 AM UTC
    - cron: '30 1 * * *'
    # 12:30 PM IST = 7:00 AM UTC
    - cron: '0 7 * * *'
    # 5:00 PM IST = 11:30 AM UTC
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Time slot to send (morning/afternoon/evening)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run mode (true/false) — prints message without sending'
        required: false
        default: 'false'

jobs:
  send-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq

      - name: Determine time slot
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          else
            # Determine slot from current UTC time
            HOUR=$(date -u +%-H)
            MINUTE=$(date -u +%-M)
            UTC_MINUTES=$((HOUR * 60 + MINUTE))

            # 1:30 UTC (90 min) → morning
            # 7:00 UTC (420 min) → afternoon
            # 11:30 UTC (690 min) → evening
            if [ $UTC_MINUTES -lt 300 ]; then
              echo "slot=morning" >> $GITHUB_OUTPUT
            elif [ $UTC_MINUTES -lt 600 ]; then
              echo "slot=afternoon" >> $GITHUB_OUTPUT
            else
              echo "slot=evening" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Send daily plan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIME_SLOT: ${{ steps.slot.outputs.slot }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          chmod +x scripts/send_plan.sh
          bash scripts/send_plan.sh

      - name: Commit updated history
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        run: |
          git config user.name "Kiyu Planner Bot"
          git config user.email "bot@kiyu-planner.local"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "📋 Update activity history [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
