name: 🚀 Deploy Progress Tracker to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages_setup
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Verify Pages Configuration
        if: steps.pages_setup.outcome == 'failure'
        run: |
          echo "❌ Error: GitHub Pages is not enabled or not set to 'GitHub Actions'!"
          echo ""
          echo "👉 Quick 10-second fix:"
          echo "   1. Open: https://github.com/${{ github.repository }}/settings/pages"
          echo "   2. Under 'Build and deployment' -> 'Source', select 'GitHub Actions'"
          echo "   3. After selecting 'GitHub Actions', re-run this workflow!"
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
